[project]
name = "gitcommit-ai"
version = "0.1.0"
description = "An agentic Git commit message generator powered by AI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["git", "commit", "llm", "ai", "langgraph", "conventional-commits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
    "Typing :: Typed",
]
authors = [
    { name = "Vaibhav", email = "vaibhavbarman2609@gmail.com" },
]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6,<2.0",
    "pydantic>=2.0,<3.0",
    "python-dotenv>=1.0,<2.0",
    "typer>=0.15.0,<1.0",
]

[project.urls]
Homepage = "https://github.com/vaibhav-barman/gitcommit-ai"
Repository = "https://github.com/vaibhav-barman/gitcommit-ai"
Issues = "https://github.com/vaibhav-barman/gitcommit-ai/issues"
Changelog = "https://github.com/vaibhav-barman/gitcommit-ai/blob/main/CHANGELOG.md"

[project.scripts]
gitcommit-ai = "git_commit_ai.cli.main:app"
git-ai-commit = "git_commit_ai.cli.git_subcommand:git_ai_commit"

[project.optional-dependencies]
openai = [
    "openai>=1.50,<3.0",
]
anthropic = [
    "anthropic>=0.40,<1.0",
]
gemini = [
    "google-genai>=1.0,<2.0",
]
ollama = [
    "ollama>=0.4,<1.0",
]
all = [
    "gitcommit-ai[openai,anthropic,gemini,ollama]",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11.0,<1.0",
    "mypy>=1.15.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_ai"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
    "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TCH"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["git_commit_ai"]
