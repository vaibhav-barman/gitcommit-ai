[project]
name = "gitcommit-ai"
version = "0.1.0"
description = "An agentic Git commit message generator powered by AI"
readme = "README.md"
authors = [
    { name = "Vaibhav", email = "vaibhavbarman2609@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6,<2.0",
    "pydantic>=2.0,<3.0",
    "typer>=0.15.0,<1.0",
]

[project.scripts]
gitcommit-ai = "git_commit_ai.cli.main:app"

[project.optional-dependencies]
openai = [
    "openai>=1.50,<3.0",
]
anthropic = [
    "anthropic>=0.40,<1.0",
]
gemini = [
    "google-genai>=1.0,<2.0",
]
ollama = [
    "ollama>=0.4,<1.0",
]
all = [
    "gitcommit-ai[openai,anthropic,gemini,ollama]",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.11.0,<1.0",
    "mypy>=1.15.0,<2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_commit_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["git_commit_ai"]
